name: Feature Request
description: Suggest a new feature or improvement for the container or CLI
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        > [!IMPORTANT]
        > Do not dump AI-generated walls of text here. They are noisy, often not nearly as helpful as they seem, and are extra time-consuming to review.
        >
        > If you're using an AI assistant, be kind enough to summarize the issue in your own words.
  - type: textarea
    attributes:
      label: Problem or limitation
      description: |
        What's the problem you're running into, or what's missing?
      placeholder: |
        I want to back up only the save files, not the entire game tree.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: |
        Describe how you'd like this to work.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: |
        Have you tried any workarounds or considered other approaches?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: |
        Any other context — links to upstream issues, related env vars, compose examples, etc.
