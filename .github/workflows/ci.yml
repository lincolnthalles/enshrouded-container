name: CI

on:
  merge_group:
  pull_request:
    paths:
      - "**/workflows/*.yml"
      - "**/uv.lock"
      - "**/pyproject.toml"
      - "**/*.py"
      - "justfile"
  push:
    branches: ["main"]
    paths:
      - "**/workflows/*.yml"
      - "**/uv.lock"
      - "**/pyproject.toml"
      - "**/*.py"
      - "justfile"
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # Never persist downloaded wheels: restoring a truncated one is how a
          # broken dependency reached every later run. Source builds stay cached.
          prune-cache: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          probe() {
            uv run --no-sync python -c "import pytest, rich.console, rich.prompt, rich.table, rich.text, textual.app, textual.binding, textual.widgets, zstandard" &&
              uv run --no-sync ruff --version &&
              uv run --no-sync pyrefly --version
          }
          uv sync --no-install-project
          if probe; then
            exit 0
          fi
          echo "::warning::Restored dependencies are unusable; clearing the uv cache and reinstalling"
          uv cache clean
          uv sync --reinstall --no-install-project
          probe

      - name: Run tests
        run: uv run pytest src/tests/

      - name: Lint
        run: uv run ruff check src/enshctl src/tests/

      - name: Typecheck
        run: uv run pyrefly check --output-format=github
