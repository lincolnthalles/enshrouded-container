services:
  enshrouded:
    image: ghcr.io/lincolnthalles/enshrouded-container:latest
    container_name: enshrouded-server
    restart: on-failure:5
    stop_grace_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "15637:15637/udp"
    volumes:
      - ./enshrouded-data/backups:/data/backups
      - ./enshrouded-data/config:/data/config
      - ./enshrouded-data/logs:/data/logs
      - ./enshrouded-data/mods:/data/mods
      - ./enshrouded-data/saves:/data/saves
      - ./enshrouded-data/manifests:/data/manifests
      - enshrouded_wineprefix:/data/wineprefix

    # Optional. Ntsync may improve the game server performance.
    #!! If ntsync support is _not_ enabled in your Linux kernel (`lsmod | grep ntsync`),
    #!! leave this directive commented out, or the container will fail to start.
    # To check if ntsync is being used while the server is running: `lsof -p $(pidof wineserver) | grep ntsync`
    #
    # devices: [/dev/ntsync:/dev/ntsync]

    # Optional. Allow backups to run at a lower priority.
    cap_add: [SYS_NICE]

volumes:
  enshrouded_wineprefix:
